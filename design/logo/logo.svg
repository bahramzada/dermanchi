  <path fill="url(#mark)" fill-rule="evenodd" d="
    M340 236 H468 A276 276 0 0 1 468 788 H340 A56 56 0 0 1 284 732 V292 A56 56 0 0 1 340 236 Z
    M512 322 L621.8 486.8 A132 132 0 1 1 402.2 486.8 Z"/>

  <!-- damcının parıltısı -->
  <path d="M435.8 604 A88 88 0 0 0 474.8 639.8" fill="none" stroke="#6EE7D3" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round"/>
