name: Dermanchi
options:
  bundleIdPrefix: com.raullte
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: az
settings:
  base:
    DEVELOPMENT_TEAM: Y7X6GPG2MR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dermanchi:
    type: application
    platform: iOS
    sources: [Dermanchi]
    entitlements:
      path: Dermanchi/Dermanchi.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raullte.dermanchi]
    dependencies:
      - target: DermanchiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi
        PRODUCT_NAME: Dermanchi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dərmanchı
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DermanchiWidget:
    type: app-extension
    platform: iOS
    sources:
      - DermanchiWidget
      - Dermanchi/Model
      - Dermanchi/Logic
      - Dermanchi/Widgets
    entitlements:
      path: DermanchiWidget/DermanchiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raullte.dermanchi]
    info:
      path: DermanchiWidget/Info.plist
      properties:
        CFBundleDisplayName: Dərmanchı
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi.widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  DermanchiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DermanchiTests]
    dependencies:
      - target: Dermanchi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi.tests
schemes:
  Dermanchi:
    build:
      targets:
        Dermanchi: all
    test:
      targets: [DermanchiTests]
