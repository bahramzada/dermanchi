name: Dermanchi
options:
  bundleIdPrefix: com.raullte
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: Y7X6GPG2MR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Bump the marketing version by hand for a user-visible release; the build number is the git commit count.
    MARKETING_VERSION: "1.5"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dermanchi:
    type: application
    platform: iOS
    sources: [Dermanchi]
    entitlements:
      path: Dermanchi/Dermanchi.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raullte.dermanchi]
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    dependencies:
      - target: DermanchiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi
        PRODUCT_NAME: Dermanchi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dərmanchı
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DermanchiWidget:
    type: app-extension
    platform: iOS
    sources:
      - DermanchiWidget
      - Dermanchi/Model
      - Dermanchi/Logic
      - Dermanchi/Widgets
      - Dermanchi/Resources
    entitlements:
      path: DermanchiWidget/DermanchiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raullte.dermanchi]
    info:
      path: DermanchiWidget/Info.plist
      properties:
        CFBundleDisplayName: Dərmanchı
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  DermanchiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DermanchiTests]
    dependencies:
      - target: Dermanchi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.raullte.dermanchi.tests
schemes:
  Dermanchi:
    build:
      targets:
        Dermanchi: all
    test:
      targets: [DermanchiTests]
